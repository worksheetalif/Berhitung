<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worksheet Berhitung Hewan (10 Halaman)</title>
<style>
*{box-sizing:border-box;user-select:none}
body{font-family:sans-serif;background:#E0F7FA;margin:0;padding:15px;text-align:center;color:#333}
.card{background:#fff;max-width:520px;margin:auto;border-radius:24px;padding:20px;border:4px solid #00BCD4;box-shadow:0 8px 20px rgba(0,0,0,.1)}
.top-bar{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:15px;margin-bottom:10px;color:#00838F}
.progress{background:#B2EBF2;height:10px;border-radius:10px;overflow:hidden;margin-bottom:15px}
.bar{background:#FF9800;height:100%;width:10%;transition:.3s}
h2{margin:5px 0 12px;font-size:20px;color:#263238}
.btn-suara{background:#FFD54F;border:none;border-radius:50px;padding:8px 18px;font-size:15px;font-weight:bold;cursor:pointer;box-shadow:0 3px #FBC02D;margin-bottom:15px}
.area{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:12px;background:#F1F8E9;border:3px dashed #8BC34A;border-radius:18px;padding:18px;min-height:140px;margin-bottom:20px}
.hewan{width:76px;height:76px;position:relative;cursor:pointer;transition:transform .15s}
.hewan:active{transform:scale(.9)}
.badge{position:absolute;top:-5px;right:-5px;background:#FF5252;color:#fff;width:26px;height:26px;border-radius:50%;font-weight:bold;font-size:14px;line-height:26px;border:2px solid #fff}
.opsi{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.num{width:62px;height:62px;font-size:24px;font-weight:bold;border:none;border-radius:16px;background:#26C6DA;color:#fff;cursor:pointer;box-shadow:0 4px #0097A7}
.num.ok{background:#4CAF50;box-shadow:0 4px #388E3C;transform:scale(1.08)}
.num.no{background:#FF5252;box-shadow:0 4px #D32F2F}
.msg{font-size:18px;font-weight:bold;min-height:26px;margin-top:15px}
.next{display:none;margin:15px auto 0;background:#FF9800;color:#fff;border:none;border-radius:14px;padding:12px 26px;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 4px #F57C00}
.selesai{display:none;padding:20px 10px}
.piala{font-size:70px;margin:10px 0}
</style>
</head>
<body>

<div class="card" id="game-box">
  <div class="top-bar">
    <span id="hal">Halaman 1 / 10</span>
    <span>Bintang: <b id="skor">0</b> ★</span>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
  
  <h2 id="soal"></h2>
  <button class="btn-suara" onclick="bicara(teksSoal)">🔊 Dengarkan Soal</button>
  
  <div class="area" id="area"></div>
  
  <div class="opsi" id="opsi"></div>
  
  <div class="msg" id="msg"></div>
  <button class="next" id="next" onclick="lanjut()">Halaman Berikutnya ➔</button>
</div>

<div class="card selesai" id="end-box">
  <div class="piala">🏆</div>
  <h2 style="font-size:24px;color:#FF9800">Selamat! Selesai 10 Halaman!</h2>
  <p style="font-size:18px">Kamu berhasil mengumpulkan:</p>
  <h1 style="color:#4CAF50;font-size:36px;margin:10px 0"><span id="skor-akhir">0</span> / 10 Bintang ★</h1>
  <p style="color:#666">Anak hebat! Terus semangat belajar berhitung ya!</p>
  <button class="next" style="display:inline-block" onclick="ulang()">Main Lagi 🔄</button>
</div>

<script>
const svgHewan={
  kucing:'<svg viewBox="0 0 100 100"><polygon points="20,40 30,12 48,30" fill="#FFB74D"/><polygon points="80,40 70,12 52,30" fill="#FFB74D"/><circle cx="50" cy="56" r="32" fill="#FFB74D"/><circle cx="38" cy="50" r="4" fill="#333"/><circle cx="62" cy="50" r="4" fill="#333"/><polygon points="46,60 54,60 50,65" fill="#FF7043"/><path d="M42,68 Q50,74 58,68" stroke="#333" stroke-width="3" fill="none"/></svg>',
  bebek:'<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="32" fill="#FFEB3B"/><circle cx="38" cy="45" r="4" fill="#333"/><circle cx="62" cy="45" r="4" fill="#333"/><ellipse cx="50" cy="60" rx="14" ry="8" fill="#FF9800"/></svg>',
  katak:'<svg viewBox="0 0 100 100"><circle cx="32" cy="30" r="12" fill="#66BB6A"/><circle cx="68" cy="30" r="12" fill="#66BB6A"/><circle cx="32" cy="30" r="5" fill="#333"/><circle cx="68" cy="30" r="5" fill="#333"/><ellipse cx="50" cy="60" rx="36" ry="26" fill="#66BB6A"/><path d="M32,64 Q50,78 68,64" stroke="#2E7D32" stroke-width="4" fill="none"/></svg>',
  kelinci:'<svg viewBox="0 0 100 100"><ellipse cx="36" cy="26" rx="8" ry="22" fill="#F8BBD0"/><ellipse cx="64" cy="26" rx="8" ry="22" fill="#F8BBD0"/><circle cx="50" cy="62" r="28" fill="#FCE4EC" stroke="#F48FB1" stroke-width="3"/><circle cx="40" cy="56" r="4" fill="#333"/><circle cx="60" cy="56" r="4" fill="#333"/><circle cx="50" cy="65" r="4" fill="#EC407A"/></svg>',
  ikan:'<svg viewBox="0 0 100 100"><polygon points="75,50 95,30 95,70" fill="#29B6F6"/><ellipse cx="45" cy="50" rx="34" ry="22" fill="#4FC3F7"/><circle cx="28" cy="45" r="4" fill="#333"/><path d="M48,38 Q40,50 48,62" stroke="#0288D1" stroke-width="3" fill="none"/></svg>',
  kura:'<svg viewBox="0 0 100 100"><circle cx="18" cy="60" r="10" fill="#81C784"/><circle cx="32" cy="76" r="7" fill="#81C784"/><circle cx="68" cy="76" r="7" fill="#81C784"/><path d="M22,65 A28,28 0 0,1 78,65 Z" fill="#4CAF50"/><circle cx="15" cy="57" r="2" fill="#333"/></svg>',
  lebah:'<svg viewBox="0 0 100 100"><ellipse cx="42" cy="28" rx="12" ry="16" fill="#B3E5FC"/><ellipse cx="58" cy="28" rx="12" ry="16" fill="#B3E5FC"/><ellipse cx="50" cy="56" rx="32" ry="22" fill="#FFD600"/><rect x="38" y="36" width="7" height="40" fill="#333"/><rect x="54" y="36" width="7" height="40" fill="#333"/><circle cx="28" cy="52" r="3" fill="#333"/></svg>',
  beruang:'<svg viewBox="0 0 100 100"><circle cx="26" cy="30" r="12" fill="#8D6E63"/><circle cx="74" cy="30" r="12" fill="#8D6E63"/><circle cx="50" cy="56" r="32" fill="#8D6E63"/><circle cx="50" cy="64" r="12" fill="#D7CCC8"/><circle cx="38" cy="48" r="4" fill="#333"/><circle cx="62" cy="48" r="4" fill="#333"/><circle cx="50" cy="60" r="4" fill="#333"/></svg>',
  ayam:'<svg viewBox="0 0 100 100"><path d="M42,24 Q50,10 58,24" fill="#FF5252"/><circle cx="50" cy="56" r="30" fill="#FFF59D" stroke="#FBC02D" stroke-width="3"/><circle cx="38" cy="50" r="4" fill="#333"/><circle cx="62" cy="50" r="4" fill="#333"/><polygon points="44,58 56,58 50,68" fill="#FF9800"/></svg>',
  kepiting:'<svg viewBox="0 0 100 100"><circle cx="24" cy="32" r="10" fill="#FF5252"/><circle cx="76" cy="32" r="10" fill="#FF5252"/><ellipse cx="50" cy="60" rx="32" ry="20" fill="#FF5252"/><circle cx="40" cy="54" r="4" fill="#fff"/><circle cx="60" cy="54" r="4" fill="#fff"/><circle cx="40" cy="54" r="2" fill="#333"/><circle cx="60" cy="54" r="2" fill="#333"/></svg>'
};

const daftarSoal=[
  {nama:"kucing",kode:"kucing",jml:2},
  {nama:"bebek",kode:"bebek",jml:3},
  {nama:"katak",kode:"katak",jml:1},
  {nama:"kelinci",kode:"kelinci",jml:4},
  {nama:"ikan",kode:"ikan",jml:5},
  {nama:"kura-kura",kode:"kura",jml:3},
  {nama:"lebah",kode:"lebah",jml:4},
  {nama:"beruang",kode:"beruang",jml:2},
  {nama:"anak ayam",kode:"ayam",jml:5},
  {nama:"kepiting",kode:"kepiting",jml:3}
];

const kataAngka=["","Satu","Dua","Tiga","Empat","Lima"];
let idx=0,skor=0,klik=0,terjawab=false,teksSoal="";

function bicara(teks){
  if('speechSynthesis' in window){
    speechSynthesis.cancel();
    let u=new SpeechSynthesisUtterance(teks);
    u.lang='id-ID';u.rate=0.9;u.pitch=1.15;
    speechSynthesis.speak(u);
  }
}

function muatHalaman(){
  terjawab=false;klik=0;
  let data=daftarSoal[idx];
  document.getElementById('hal').innerText=`Halaman ${idx+1} / 10`;
  document.getElementById('bar').style.width=`${(idx+1)*10}%`;
  document.getElementById('msg').innerText="";
  document.getElementById('next').style.display="none";
  
  teksSoal=`Ada berapa ${data.nama}?`;
  document.getElementById('soal').innerText=teksSoal;

  let area=document.getElementById('area');
  area.innerHTML="";
  for(let i=0;i<data.jml;i++){
    let div=document.createElement('div');
    div.className='hewan';
    div.innerHTML=svgHewan[data.kode];
    div.onclick=function(){
      if(!this.dataset.no){
        klik++;this.dataset.no=klik;
        this.innerHTML+=`<div class="badge">${klik}</div>`;
      }
      bicara(kataAngka[this.dataset.no]);
    };
    area.appendChild(div);
  }

  let opsi=document.getElementById('opsi');
  opsi.innerHTML="";
  for(let n=1;n<=5;n++){
    let btn=document.createElement('button');
    btn.className='num';
    btn.innerText=n;
    btn.onclick=()=>cekJawaban(n,btn);
    opsi.appendChild(btn);
  }
}

function cekJawaban(pilih,btn){
  if(terjawab)return;
  let data=daftarSoal[idx];
  if(pilih===data.jml){
    terjawab=true;
    skor++;
    document.getElementById('skor').innerText=skor;
    btn.classList.add('ok');
    document.getElementById('msg').style.color="#4CAF50";
    document.getElementById('msg').innerText=`Hebat! Ada ${data.jml} ${data.nama}!`;
    let tombolNext=document.getElementById('next');
    tombolNext.innerText=(idx===9)?"Lihat Hasil 🏆":"Halaman Berikutnya ➔";
    tombolNext.style.display="inline-block";
    bicara(`Hebat! Ada ${kataAngka[data.jml]} ${data.nama}!`);
  }else{
    btn.classList.add('no');
    document.getElementById('msg').style.color="#FF5252";
    document.getElementById('msg').innerText="Coba hitung lagi ya!";
    bicara(`${kataAngka[pilih]}. Coba hitung lagi ya!`);
    setTimeout(()=>btn.classList.remove('no'),700);
  }
}

function lanjut(){
  if(idx<9){
    idx++;
    muatHalaman();
    bicara(teksSoal);
  }else{
    document.getElementById('game-box').style.display="none";
    document.getElementById('end-box').style.display="block";
    document.getElementById('skor-akhir').innerText=skor;
    bicara(`Selamat! Kamu menyelesaikan sepuluh halaman dengan ${skor} bintang!`);
  }
}

function ulang(){
  idx=0;skor=0;
  document.getElementById('skor').innerText=0;
  document.getElementById('end-box').style.display="none";
  document.getElementById('game-box').style.display="block";
  muatHalaman();
  bicara(teksSoal);
}

muatHalaman();
</script>
</body>
</html>
